name: Keep the API awake

# Render's free plan puts the API to sleep after ~15 minutes without traffic, and the first request then waits
# ~20-50 s while it wakes (apps look broken meanwhile). One ping every 10 minutes keeps it up; a single always-on
# service fits inside Render's free 750 hours a month. It also keeps the in-process refresh of prices and offers running.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Frontend and Backend APIs
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Pinging OnRoad backend..."
            b_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://onroad-uu9c.onrender.com/api/health) && echo "Backend HTTP: $b_code"
            echo "Attempt $i: Pinging OnRoad frontend proxy..."
            f_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://onroad-frontend.onrender.com/api/health) && echo "Frontend HTTP: $f_code"
            if [ "$b_code" = "200" ] && [ "$f_code" = "200" ]; then
              echo "Both services are awake and healthy."
              exit 0
            fi
            sleep 15
          done
          echo "One or more services did not answer with 200"; exit 1
