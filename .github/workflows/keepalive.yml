name: Keep the API awake

# Render's free plan puts the API to sleep after ~15 minutes without traffic, and the first request then waits
# ~20-50 s while it wakes (apps look broken meanwhile). One ping every 10 minutes keeps it up; a single always-on
# service fits inside Render's free 750 hours a month. It also keeps the in-process refresh of prices and offers running.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the OnRoad API
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://onroad-uu9c.onrender.com/api/meta) && echo "status $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "API did not answer"; exit 1
