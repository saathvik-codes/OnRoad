<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="100%" height="100%">
  <defs>
    <linearGradient id="jawaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b81d24" />
      <stop offset="100%" stop-color="#801015" />
    </linearGradient>
    <linearGradient id="jawaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
  </defs>
  <!-- Outer Oval Badge -->
  <ellipse cx="150" cy="60" rx="140" ry="52" fill="url(#jawaRed)" stroke="url(#jawaGold)" stroke-width="5" />
  <ellipse cx="150" cy="60" rx="133" ry="46" fill="none" stroke="url(#jawaGold)" stroke-width="1.5" />
  
  <!-- Classic JAWA Typography -->
  <text x="150" y="73" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" 
        font-size="44" 
        font-weight="900" 
