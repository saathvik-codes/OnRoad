        fill="url(#jawaGold)">JAWA</text>
  
  <!-- Subtext / Established Motif -->
  <path d="M 90 85 Q 150 90 210 85" fill="none" stroke="url(#jawaGold)" stroke-width="1.5" />
  <circle cx="150" cy="28" r="4" fill="url(#jawaGold)" />
  <path d="M 140 28 L 130 25 L 140 27 Z" fill="url(#jawaGold)" />
  <path d="M 160 28 L 170 25 L 160 27 Z" fill="url(#jawaGold)" />
