# render.yaml — Render.com Blueprint
# Drop this file into the repo root and click "New → Blueprint" on Render.
# All services, env vars, and the persistent disk are created automatically.

services:
  # ── FastAPI Backend ────────────────────────────────────────────────────────
  - type: web
    name: onroad-backend
    autoDeploy: true                  # redeploy on every push to main
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: starter                     # persistent disks need a paid plan; free services also sleep, which stops the refresh
    region: singapore                 # closest to India
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8100"
      - key: DB_PATH
        value: /data/onroad.db
      - key: IMG_CACHE
        value: /data/img_cache
      - key: COOKIE_SECURE
        value: "1"
      - key: REFRESH_EVERY_HOURS       # in-process refresh of prices, offers, dealers, specs, loan rates, images
        value: "6"
      - key: API_SECRET
        generateValue: true           # Render auto-generates a secure random secret
    disk:
      name: onroad-data
      mountPath: /data
      sizeGB: 1                       # holds the ~46 MB SQLite DB + img cache

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  - type: web
    name: onroad-web
    autoDeploy: true
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: API_ORIGIN
        fromService:
          type: web
          name: onroad-backend
          property: hostport         # backend's internal host:port (next.config.ts adds http://)
          envVarKey: API_ORIGIN
